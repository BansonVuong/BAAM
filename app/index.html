<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BAAM</title>
    <meta name="description" content="Bet your friends in the group chat. Friends witness it, the winner gets paid." />
    <meta name="robots" content="noindex, nofollow" />
    <script>
      // Apply the saved theme before first paint so dark mode doesn't flash light.
      try { if (localStorage.getItem("BAAM_theme") === "dark") document.documentElement.classList.add("dark"); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
